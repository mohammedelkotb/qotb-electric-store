<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qotb Electric Store — معرض المنتجات والأسعار</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #13294B;
      --primary-light: #1e3d6e;
      --brand-red: #C82333;
      --accent: #D4A843;
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #13294B;
      --muted: #64748b;
      --danger: #C82333;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }

    /* Header */
    header {
      background: #ffffff;
      color: var(--primary);
      padding: 10px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 3px solid var(--accent);
      box-shadow: 0 4px 14px rgba(19, 41, 75, 0.07);
    }
    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 auto; }
    .brand-logo {
      height: 50px;
      width: auto;
      max-width: 150px;
      object-fit: contain;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .brand-text-wrap { display: flex; flex-direction: column; min-width: 0; }
    .brand h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.2;
      overflow-wrap: anywhere;
    }
    .brand-sub {
      background: rgba(200, 35, 51, 0.1);
      color: var(--brand-red);
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      width: fit-content;
      margin-top: 3px;
      border: 1px solid rgba(212, 168, 67, 0.45);
    }

    .btn {
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn-brand {
      background: var(--primary);
      color: #fff;
      border-bottom: 2px solid var(--accent);
    }
    .btn-brand:hover { background: var(--primary-light); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-light); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-outline { background: #fff; border: 1px solid var(--border); color: var(--text); }
    .btn-wa { background: #25D366; color: #fff; width: 100%; justify-content: center; font-size: 0.95rem; }
    .btn-wa:hover { background: #1ebe5d; }

    /* Container & Filters */
    .container { max-width: 1200px; margin: 20px auto; padding: 0 16px; }
    .controls {
      background: var(--card);
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(19, 41, 75, 0.04);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      border-top: 3px solid var(--accent);
    }
    .search-box { flex: 1 1 240px; min-width: 200px; }
    .category-select { width: auto; min-width: 170px; }
    input, select, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      color: var(--text);
      background: #fff;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }

    .filter-pills { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill {
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--primary);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .pill.active { background: var(--brand-red); color: #fff; border-color: var(--brand-red); }

    /* Product Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }
    .card {
      background: var(--card);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      position: relative;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 22px rgba(19, 41, 75, 0.1);
      border-color: var(--accent);
    }
    .badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--brand-red);
      color: #fff;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      z-index: 2;
      box-shadow: 0 2px 6px rgba(200, 35, 51, 0.25);
    }
    .img-count {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(19, 41, 75, 0.82);
      color: #fff;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
    }
    .card-img-wrap {
      position: relative;
      height: 210px;
      background: #f8fafc;
      cursor: pointer;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 8px;
    }
    .card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; }
    .sku-tag {
      font-size: 0.75rem;
      color: var(--primary);
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 2px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 6px;
      font-family: monospace;
      width: fit-content;
    }
    .card-title { font-size: 1.05rem; font-weight: 700; margin: 0 0 6px; cursor: pointer; color: var(--primary); }
    .card-desc {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .price-row { margin-top: auto; padding-top: 10px; border-top: 1px dashed var(--border); display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .price-now { font-size: 1.25rem; font-weight: 800; color: var(--brand-red); }
    .price-old { font-size: 0.9rem; color: var(--muted); text-decoration: line-through; }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(19, 41, 75, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 750px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 22px;
      position: relative;
      border-top: 4px solid var(--accent);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
    .close-btn { background: #f1f5f9; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-weight: bold; color: var(--primary); flex-shrink: 0; }

    /* Product Details Gallery */
    .gallery-main { width: 100%; height: 300px; object-fit: contain; background: #f8fafc; border-radius: 10px; border: 1px solid var(--border); }
    .thumbs { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 4px; }
    .thumbs img { width: 65px; height: 65px; object-fit: cover; border-radius: 8px; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; }
    .thumbs img.active { border-color: var(--brand-red); }

    /* Admin Panel */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label { font-size: 0.85rem; font-weight: 700; color: var(--primary); }
    .calc-preview {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--brand-red);
      background: #fef2f2;
      border: 1px solid #fecaca;
      padding: 5px 10px;
      border-radius: 6px;
      margin-top: 2px;
    }
    .admin-img-list { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .admin-img-item { position: relative; width: 75px; height: 75px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .admin-img-item img { width: 100%; height: 100%; object-fit: cover; }
    .admin-img-item button { position: absolute; top: 2px; left: 2px; background: var(--danger); color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; cursor: pointer; }
    .admin-img-item span { position: absolute; bottom: 0; right: 0; left: 0; background: rgba(19, 41, 75, 0.88); color: #fff; font-size: 10px; text-align: center; }

    .admin-toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .admin-search-wrap { flex: 1 1 220px; min-width: 180px; }

    .admin-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.85rem; }
    .admin-table th, .admin-table td { border: 1px solid var(--border); padding: 8px; text-align: right; }
    .admin-table th { background: #f1f5f9; color: var(--primary); }

    .loader { text-align: center; padding: 40px; font-weight: 700; color: var(--primary); }

    /* Tablet (601px - 1024px) */
    @media (max-width: 1024px) and (min-width: 601px) {
      .container { padding: 0 18px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
      .card-img-wrap { height: 195px; }
      .gallery-main { height: 270px; }
    }

    /* Mobile (<= 600px) */
    @media (max-width: 600px) {
      header { padding: 10px 14px; }
      .header-inner { gap: 10px; }
      .brand { gap: 9px; }
      .brand h1 { font-size: 1.02rem; }
      .brand-sub { font-size: 0.7rem; padding: 2px 8px; }
      .brand-logo { height: 40px; max-width: 110px; }
      .btn { padding: 8px 12px; font-size: 0.84rem; }
      .container { margin: 14px auto; padding: 0 12px; }
      .controls { padding: 12px; gap: 10px; }
      .search-box, .category-select, .filter-pills { width: 100%; min-width: 0; }
      .filter-pills .pill { flex: 1; text-align: center; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 12px; }
      .card-img-wrap { height: 155px; }
      .card-body { padding: 11px; }
      .card-title { font-size: 0.95rem; }
      .price-now { font-size: 1.08rem; }
      .modal-backdrop { padding: 10px; }
      .modal { padding: 15px; border-radius: 12px; max-height: 92vh; }
      .gallery-main { height: 220px; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <img id="brandLogo" class="brand-logo" src="" alt="Qotb Electric Store Logo" style="display:none;">
      <div class="brand-text-wrap">
        <h1 id="storeNameHeading">Qotb Electric Store</h1>
        <span class="brand-sub">معرض المنتجات والأسعار والعروض</span>
      </div>
    </div>
    <button class="btn btn-brand" onclick="openAdminGate()">⚙️ إدارة المنتجات</button>
  </div>
</header>

<div class="container">
  <div class="controls">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ابحث باسم المنتج، كود الشركة الأم، أو المواصفات..." oninput="renderProducts()">
    </div>
    <select id="categoryFilter" class="category-select" onchange="renderProducts()">
      <option value="ALL">كل التصنيفات</option>
    </select>
    <div class="filter-pills">
      <button class="pill active" id="pillAll" onclick="setOfferFilter(false)">الكل</button>
      <button class="pill" id="pillOffers" onclick="setOfferFilter(true)">⚡ العروض والخصومات</button>
    </div>
  </div>

  <div id="loader" class="loader">جاري تحميل المنتجات...</div>
  <div id="productsGrid" class="grid"></div>
</div>

<!-- نافذة تفاصيل المنتج -->
<div class="modal-backdrop" id="detailsModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="detTitle" style="margin:0;"></h3>
      <button class="close-btn" onclick="closeModal('detailsModal')">✕</button>
    </div>
    <img id="detMainImg" class="gallery-main" src="" alt="">
    <div id="detThumbs" class="thumbs"></div>
    <div style="margin-top: 14px;">
      <span id="detSku" class="sku-tag"></span>
      <span id="detCat" class="sku-tag" style="background:#fef3c7; color:#92400e; border-color:#fde68a;"></span>
      <p id="detDesc" style="line-height: 1.7; color: #334155; white-space: pre-line;"></p>
      <div id="detPriceBox" class="price-row"></div>
      <a id="detWaBtn" href="#" target="_blank" class="btn btn-wa">💬 اطلب المنتج عبر واتساب</a>
    </div>
  </div>
</div>

<!-- نافذة لوحة التحكم -->
<div class="modal-backdrop" id="adminModal">
  <div class="modal" style="max-width: 900px;">
    <div class="modal-header">
      <h3 style="margin:0;">لوحة إدارة المنتجات والأسعار — Qotb Electric Store</h3>
      <button class="close-btn" onclick="closeModal('adminModal')">✕</button>
    </div>

    <form id="productForm" onsubmit="saveProduct(event)">
      <input type="hidden" id="editId">
      <div class="form-grid">
        <div class="form-group">
          <label>اسم المنتج *</label>
          <input type="text" id="pName" required placeholder="مثال: مفتاح أوتوماتيك 16 أمبير">
        </div>
        <div class="form-group">
          <label>كود الشركة الأم (SKU)</label>
          <input type="text" id="pSku" placeholder="مثال: SCH-A9F74116">
        </div>
        <div class="form-group">
          <label>التصنيف</label>
          <input type="text" id="pCategory" list="catSuggestions" placeholder="مثال: قواطع، كابلات، إضاءة">
          <datalist id="catSuggestions"></datalist>
        </div>
        <div class="form-group">
          <label>شارة العرض (اختياري)</label>
          <input type="text" id="pBadge" placeholder="مثال: عرض لفترة محدودة أو عرض خاص">
        </div>
        <div class="form-group">
          <label>السعر الأساسي (ج.م) *</label>
          <input type="number" step="0.01" id="pPrice" required oninput="updateDiscountPreview()">
        </div>
        <div class="form-group">
          <label>نسبة الخصم (%) — اختياري</label>
          <input type="number" step="0.01" min="0" max="99.99" id="pDiscountPct" placeholder="مثال: 15 (تُحسب تلقائيًا)" oninput="updateDiscountPreview()">
          <div id="discountPreview" class="calc-preview">السعر بعد الخصم: لا يوجد خصم</div>
        </div>
        <div class="form-group full">
          <label>وصف ومواصفات المنتج</label>
          <textarea id="pDesc" rows="3" placeholder="اكتب التفاصيل الفنية أو بلد المنشأ أو الضمان..."></textarea>
        </div>
        <div class="form-group full">
          <label>صور المنتج (يمكنك اختيار أكثر من صورة معاً)</label>
          <input type="file" id="pFiles" accept="image/*" multiple onchange="handleImageUpload(event)">
          <small id="uploadStatus" style="color: var(--primary); font-weight: bold;"></small>
          <div id="adminImagesPreview" class="admin-img-list"></div>
        </div>
        <div class="form-group full" style="flex-direction: row; align-items: center; gap: 8px;">
          <input type="checkbox" id="pActive" checked style="width: auto;">
          <label for="pActive" style="margin:0;">إظهار المنتج للزبائن في المعرض</label>
        </div>
      </div>

      <div style="margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap;">
        <button type="submit" class="btn btn-primary" id="saveBtn">💾 حفظ المنتج</button>
        <button type="button" class="btn btn-outline" onclick="resetForm()">تفريغ الحقول</button>
      </div>
    </form>

    <hr style="margin: 24px 0; border: 0; border-top: 1px solid var(--border);">
    <div class="admin-toolbar">
      <h4 style="margin:0;">قائمة المنتجات الحالية (<span id="adminCount">0</span>)</h4>
      <div class="admin-search-wrap">
        <input type="text" id="adminSearchInput" placeholder="ابحث داخل الإدارة بالاسم، كود الشركة الأم، أو التصنيف..." oninput="renderAdminTable()">
      </div>
    </div>
    <div style="overflow-x: auto;">
      <table class="admin-table">
        <thead>
          <tr>
            <th>الكود</th>
            <th>المنتج</th>
            <th>السعر</th>
            <th>بعد الخصم</th>
            <th>الحالة</th>
            <th>إجراءات</th>
          </tr>
        </thead>
        <tbody id="adminTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // ================= إعدادات الربط والهوية =================
  const API_URL = "https://script.google.com/macros/s/AKfycbwAyhCJ3wQ3HHMgrxTzgNYyB68sl_OLQICH0vzVcDJ-8um9GgdG43DizH8JasoDPOXr/exec";
  const WHATSAPP_NUMBER = "201146653076";
  const STORE_NAME = "Qotb Electric Store";
  const LOGO_URL = "https://lh3.googleusercontent.com/d/1D205o4w_C29gH182dm_SjCfUoBVEHWPJ";
  // ==========================================================

  let allProducts = [];
  let onlyOffers = false;
  let adminPassword = "";
  let currentFormImages = [];
  const PLACEHOLDER_IMG = "https://via.placeholder.com/400x300?text=No+Image";

  window.onload = function () {
    applyBranding();
    fetchProducts();
  };

  function applyBranding() {
    document.title = `${STORE_NAME} — معرض المنتجات والأسعار`;
    document.getElementById("storeNameHeading").innerText = STORE_NAME;
    const logoEl = document.getElementById("brandLogo");
    if (LOGO_URL && LOGO_URL.trim()) {
      logoEl.src = LOGO_URL.trim();
      logoEl.style.display = "block";
    } else {
      logoEl.style.display = "none";
    }
  }

  function formatMoney(num) {
    const rounded = Math.round(Number(num) * 100) / 100;
    return Number.isInteger(rounded) ? rounded.toString() : rounded.toFixed(2);
  }

  function computeDiscountPrice(price, pct) {
    const p = parseFloat(price);
    const d = parseFloat(pct);
    if (isNaN(p) || p <= 0 || isNaN(d) || d <= 0 || d >= 100) return "";
    const discounted = p * (1 - d / 100);
    return Math.round(discounted * 100) / 100;
  }

  function updateDiscountPreview() {
    const priceVal = document.getElementById("pPrice").value;
    const pctVal = document.getElementById("pDiscountPct").value;
    const previewEl = document.getElementById("discountPreview");
    const calc = computeDiscountPrice(priceVal, pctVal);

    if (calc !== "") {
      previewEl.innerText = `السعر بعد الخصم (${pctVal}%): ${formatMoney(calc)} ج.م`;
    } else {
      previewEl.innerText = "السعر بعد الخصم: لا يوجد خصم";
    }
  }

  async function fetchProducts() {
    document.getElementById("loader").style.display = "block";
    try {
      const res = await fetch(API_URL, { redirect: "follow" });
      const json = await res.json();
      if (json.status === "success") {
        allProducts = json.data;
        populateCategories();
        renderProducts();
        if (adminPassword) renderAdminTable();
      }
    } catch (err) {
      console.error("FETCH_ERROR:", err);
      document.getElementById("loader").innerText = "حدث خطأ في تحميل البيانات: " + err.message;
    } finally {
      document.getElementById("loader").style.display = "none";
    }
  }

  function populateCategories() {
    const cats = [...new Set(allProducts.map(p => p.category).filter(Boolean))];
    const select = document.getElementById("categoryFilter");
    const datalist = document.getElementById("catSuggestions");
    select.innerHTML = '<option value="ALL">كل التصنيفات</option>';
    datalist.innerHTML = "";
    cats.forEach(c => {
      select.innerHTML += `<option value="${c}">${c}</option>`;
      datalist.innerHTML += `<option value="${c}">`;
    });
  }

  function setOfferFilter(val) {
    onlyOffers = val;
    document.getElementById("pillAll").classList.toggle("active", !val);
    document.getElementById("pillOffers").classList.toggle("active", val);
    renderProducts();
  }

  function renderProducts() {
    const q = document.getElementById("searchInput").value.trim().toLowerCase();
    const cat = document.getElementById("categoryFilter").value;
    const grid = document.getElementById("productsGrid");

    const filtered = allProducts.filter(p => {
      if (!p.active) return false;
      if (cat !== "ALL" && p.category !== cat) return false;
      const hasOffer = (p.discountPrice !== null && p.discountPrice > 0 && p.discountPrice < p.price) || p.offerBadge;
      if (onlyOffers && !hasOffer) return false;
      if (q) {
        const hay = `${p.name} ${p.sku} ${p.description} ${p.category}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    if (filtered.length === 0) {
      grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#64748b;">لا توجد منتجات مضافة أو مطابقة للبحث حاليًا.</p>';
      return;
    }

    grid.innerHTML = filtered.map(p => {
      const mainImg = p.images.length ? p.images[0] : PLACEHOLDER_IMG;
      const hasDiscount = p.discountPrice !== null && p.discountPrice > 0 && p.discountPrice < p.price;
      const finalPrice = hasDiscount ? p.discountPrice : p.price;
      const autoPct = hasDiscount ? Math.round((1 - p.discountPrice / p.price) * 10000) / 100 : 0;
      const badgeText = p.offerBadge || (hasDiscount ? `خصم ${formatMoney(autoPct)}%` : "");
      const waMsg = encodeURIComponent(`مرحباً (${STORE_NAME})، أريد الاستفسار/الطلب:\nالمنتج: ${p.name}\nالكود: ${p.sku || "غير محدد"}\nالسعر: ${formatMoney(finalPrice)} ج.م`);

      return `
        <div class="card">
          ${badgeText ? `<div class="badge">${badgeText}</div>` : ""}
          <div class="card-img-wrap" onclick="openDetails('${p.id}')">
            <img src="${mainImg}" alt="${p.name}" loading="lazy">
            ${p.images.length > 1 ? `<div class="img-count">📷 ${p.images.length} صور</div>` : ""}
          </div>
          <div class="card-body">
            ${p.sku ? `<span class="sku-tag">كود: ${p.sku}</span>` : ""}
            <h3 class="card-title" onclick="openDetails('${p.id}')">${p.name}</h3>
            <p class="card-desc">${p.description || ""}</p>
            <div class="price-row">
              <span class="price-now">${formatMoney(finalPrice)} ج.م</span>
              ${hasDiscount ? `<span class="price-old">${formatMoney(p.price)} ج.م</span>` : ""}
            </div>
            <a href="https://wa.me/${WHATSAPP_NUMBER}?text=${waMsg}" target="_blank" class="btn btn-wa">اطلب عبر واتساب</a>
          </div>
        </div>
      `;
    }).join("");
  }

  function openDetails(id) {
    const p = allProducts.find(x => x.id === id);
    if (!p) return;

    document.getElementById("detTitle").innerText = p.name;
    document.getElementById("detSku").innerText = p.sku ? `كود الشركة: ${p.sku}` : "بدون كود";
    document.getElementById("detCat").innerText = p.category || "عام";
    document.getElementById("detDesc").innerText = p.description || "لا يوجد وصف إضافي.";

    const imgs = p.images.length ? p.images : [PLACEHOLDER_IMG];
    const mainImgEl = document.getElementById("detMainImg");
    mainImgEl.src = imgs[0];

    const thumbsEl = document.getElementById("detThumbs");
    thumbsEl.innerHTML = imgs.length > 1 ? imgs.map((url, idx) => `
      <img src="${url}" class="${idx === 0 ? 'active' : ''}" onclick="switchGalleryImg(this, '${url}')">
    `).join("") : "";

    const hasDiscount = p.discountPrice !== null && p.discountPrice > 0 && p.discountPrice < p.price;
    const finalPrice = hasDiscount ? p.discountPrice : p.price;
    document.getElementById("detPriceBox").innerHTML = `
      <span class="price-now">${formatMoney(finalPrice)} ج.م</span>
      ${hasDiscount ? `<span class="price-old">${formatMoney(p.price)} ج.م</span>` : ""}
    `;

    const waMsg = encodeURIComponent(`مرحباً (${STORE_NAME})، أريد طلب:\nالمنتج: ${p.name}\nالكود: ${p.sku || "غير محدد"}\nالسعر: ${formatMoney(finalPrice)} ج.م`);
    document.getElementById("detWaBtn").href = `https://wa.me/${WHATSAPP_NUMBER}?text=${waMsg}`;

    document.getElementById("detailsModal").classList.add("open");
  }

  function switchGalleryImg(thumb, url) {
    document.getElementById("detMainImg").src = url;
    document.querySelectorAll("#detThumbs img").forEach(i => i.classList.remove("active"));
    thumb.classList.add("active");
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove("open");
  }

  // ================= لوحة التحكم =================
  async function openAdminGate() {
    if (!adminPassword) {
      const pass = prompt("أدخل كلمة مرور لوحة الإدارة:");
      if (!pass) return;
      try {
        const res = await postAPI({ action: "login", password: pass });
        if (res.status !== "success") {
          console.log("LOGIN_RESPONSE:", res);
          alert(res.message || "كلمة المرور غير صحيحة");
          return;
        }
        adminPassword = pass;
      } catch (err) {
        alert("تعذر الاتصال بالسيرفر: " + err.message);
        return;
      }
    }
    renderAdminTable();
    document.getElementById("adminModal").classList.add("open");
  }

  async function postAPI(reqBody) {
    if (!reqBody.password) {
      reqBody.password = adminPassword;
    }
    const res = await fetch(API_URL, {
      method: "POST",
      redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(reqBody)
    });
    return await res.json();
  }

  async function handleImageUpload(e) {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    const statusEl = document.getElementById("uploadStatus");
    const saveBtn = document.getElementById("saveBtn");
    saveBtn.disabled = true;

    for (let i = 0; i < files.length; i++) {
      statusEl.innerText = `جاري رفع صورة ${i + 1} من ${files.length}...`;
      const base64 = await toBase64(files[i]);
      const res = await postAPI({
        action: "uploadImage",
        fileName: files[i].name,
        mimeType: files[i].type,
        base64: base64.split(",")[1]
      });
      if (res.status === "success") {
        currentFormImages.push(res.url);
        renderFormImages();
      } else {
        alert("فشل رفع الصورة: " + res.message);
      }
    }
    statusEl.innerText = "تم رفع الصور بنجاح ✓";
    saveBtn.disabled = false;
    e.target.value = "";
  }

  function toBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = err => reject(err);
    });
  }

  function renderFormImages() {
    const wrap = document.getElementById("adminImagesPreview");
    wrap.innerHTML = currentFormImages.map((url, idx) => `
      <div class="admin-img-item">
        <img src="${url}" onclick="makePrimaryImg(${idx})" title="اضغط لجعلها الصورة الرئيسية">
        <button type="button" onclick="removeFormImg(${idx})">✕</button>
        ${idx === 0 ? "<span>رئيسية</span>" : ""}
      </div>
    `).join("");
  }

  function makePrimaryImg(idx) {
    if (idx === 0) return;
    const [img] = currentFormImages.splice(idx, 1);
    currentFormImages.unshift(img);
    renderFormImages();
  }

  function removeFormImg(idx) {
    currentFormImages.splice(idx, 1);
    renderFormImages();
  }

  async function saveProduct(e) {
    e.preventDefault();
    const saveBtn = document.getElementById("saveBtn");
    saveBtn.disabled = true;
    saveBtn.innerText = "جاري الحفظ...";

    const editId = document.getElementById("editId").value;
    const priceInput = document.getElementById("pPrice").value;
    const pctInput = document.getElementById("pDiscountPct").value;
    const calculatedDiscountPrice = computeDiscountPrice(priceInput, pctInput);

    const product = {
      id: editId,
      name: document.getElementById("pName").value.trim(),
      sku: document.getElementById("pSku").value.trim(),
      category: document.getElementById("pCategory").value.trim() || "عام",
      offerBadge: document.getElementById("pBadge").value.trim(),
      price: priceInput,
      discountPrice: calculatedDiscountPrice,
      description: document.getElementById("pDesc").value.trim(),
      images: currentFormImages,
      active: document.getElementById("pActive").checked
    };

    const res = await postAPI({
      action: editId ? "update" : "add",
      product
    });

    saveBtn.disabled = false;
    saveBtn.innerText = "💾 حفظ المنتج";

    if (res.status === "success") {
      resetForm();
      await fetchProducts();
    } else {
      alert(res.message);
    }
  }

  function editProduct(id) {
    const p = allProducts.find(x => x.id === id);
    if (!p) return;
    document.getElementById("editId").value = p.id;
    document.getElementById("pName").value = p.name;
    document.getElementById("pSku").value = p.sku;
    document.getElementById("pCategory").value = p.category;
    document.getElementById("pBadge").value = p.offerBadge;
    document.getElementById("pPrice").value = p.price;

    if (p.discountPrice !== null && p.discountPrice > 0 && p.price > 0 && p.discountPrice < p.price) {
      const pct = Math.round((1 - p.discountPrice / p.price) * 10000) / 100;
      document.getElementById("pDiscountPct").value = pct;
    } else {
      document.getElementById("pDiscountPct").value = "";
    }

    updateDiscountPreview();
    document.getElementById("pDesc").value = p.description;
    document.getElementById("pActive").checked = p.active;
    currentFormImages = [...p.images];
    renderFormImages();
    document.getElementById("adminModal").querySelector(".modal").scrollTop = 0;
  }

  async function deleteProduct(id) {
    if (!confirm("هل أنت متأكد من حذف هذا المنتج نهائياً؟")) return;
    const res = await postAPI({ action: "delete", id });
    if (res.status === "success") {
      await fetchProducts();
    } else {
      alert(res.message);
    }
  }

  function resetForm() {
    document.getElementById("productForm").reset();
    document.getElementById("editId").value = "";
    document.getElementById("uploadStatus").innerText = "";
    currentFormImages = [];
    renderFormImages();
    updateDiscountPreview();
  }

  function renderAdminTable() {
    const searchEl = document.getElementById("adminSearchInput");
    const q = searchEl ? searchEl.value.trim().toLowerCase() : "";

    const filtered = allProducts.filter(p => {
      if (!q) return true;
      const hay = `${p.name} ${p.sku} ${p.category} ${p.description}`.toLowerCase();
      return hay.includes(q);
    });

    document.getElementById("adminCount").innerText = q ? `${filtered.length} / ${allProducts.length}` : allProducts.length;
    const tbody = document.getElementById("adminTableBody");

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#64748b;">لا توجد منتجات مطابقة للبحث داخل الإدارة.</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map(p => `
      <tr>
        <td><code>${p.sku || "-"}</code></td>
        <td>${p.name}</td>
        <td>${formatMoney(p.price)}</td>
        <td>${p.discountPrice !== null && p.discountPrice > 0 ? formatMoney(p.discountPrice) : "-"}</td>
        <td>${p.active ? "ظاهر" : "مخفي"}</td>
        <td style="white-space:nowrap;">
          <button class="btn btn-outline" style="padding:4px 8px;" onclick="editProduct('${p.id}')">تعديل</button>
          <button class="btn btn-danger" style="padding:4px 8px;" onclick="deleteProduct('${p.id}')">حذف</button>
        </td>
      </tr>
    `).join("");
  }
</script>
</body>
</html>
